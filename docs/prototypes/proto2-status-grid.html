<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:480px;height:480px;overflow:hidden}
body{font-family:'Inter','SF Pro Display','Segoe UI',Roboto,'Ubuntu',sans-serif;-webkit-font-smoothing:antialiased}
.panel{width:480px;height:480px;display:flex;flex-direction:column;background:#000;color:#fff;padding:13px 14px 12px}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px 9px;border-bottom:1px solid #20252B;margin-bottom:10px}
.temp{font-size:30px;font-weight:800;line-height:.9;letter-spacing:-1px}
.temp span{font-size:17px;font-weight:600;color:#9AA4AF;letter-spacing:0}
.loc{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#8A939D;margin-top:5px}
.hz{text-align:right;font-size:12px;line-height:1.45;font-weight:600;color:#9AA4AF}
.hz b{color:#fff;font-weight:700}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px}
.tile{border-radius:7px;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;
  background:#0D1114;border:1px solid #1A2026}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#7E8892}
.st{font-size:25px;font-weight:900;line-height:1;letter-spacing:-.5px;display:flex;align-items:baseline;gap:4px}
.st small{font-size:13px;font-weight:700;letter-spacing:0}
.ic{margin-top:6px}
.ic svg{width:17px;height:17px;stroke:#5A6470;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ON = saturated fill, dark text (Polestar orange) */
.on{background:#FF7A1A;border-color:#FF7A1A}
.on .lbl{color:rgba(10,7,2,.75)}
.on .st{color:#0B0703}
.on .ic svg{stroke:#0B0703}
/* off */
.off .st{color:#39424C}
.off .lbl{color:#59636E}
/* partial (blinds) */
.val .st{color:#FF7A1A}
.val .lbl{color:#fff}
.val .bar{height:4px;border-radius:2px;background:#1C2228;margin-top:8px;overflow:hidden}
.val .bar i{display:block;height:100%;width:45%;background:#FF7A1A}
/* outlined action */
.act{background:transparent;border:1px solid #39424C}
.act .lbl{color:#fff}
.act .st{color:#fff;font-size:17px;font-weight:800}
</style></head><body>
<div class="panel">
  <header>
    <div><div class="temp">22.1<span>&#176;C</span></div><div class="loc">OFFICE</div></div>
    <div class="hz"><b>50%</b> humidity<br>window <b>closed</b></div>
  </header>
  <div class="grid">
    <div class="tile on">
      <div class="lbl">Spots</div>
      <div><div class="st">ON</div><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M12 13v6M8 21h8"/></svg></div></div>
    </div>
    <div class="tile on">
      <div class="lbl">Nanoleaf</div>
      <div><div class="st">ON</div><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v8l-7 4-7-4V7z"/><path d="M12 11v8M5 7l7 4 7-4"/></svg></div></div>
    </div>
    <div class="tile on">
      <div class="lbl">Desk LED</div>
      <div><div class="st">ON</div><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="4" rx="2"/><path d="M6 16v2M18 16v2"/></svg></div></div>
    </div>
    <div class="tile off">
      <div class="lbl">Air con</div>
      <div><div class="st">OFF</div><div class="ic"><svg viewBox="0 0 24 24"><path d="M9.5 4h5l.7 3.5c1.8 1 3 3 3 5.2A5.8 5.8 0 0 1 12.4 18h-.8a5.8 5.8 0 0 1-5.8-5.3c0-2.2 1.2-4.2 3-5.2z"/><path d="M10 21h4"/></svg></div></div>
    </div>
    <div class="tile val">
      <div class="lbl">Blinds</div>
      <div><div class="st">45<small>%</small></div><div class="bar"><i></i></div></div>
    </div>
    <div class="tile act">
      <div class="lbl">All off</div>
      <div><div class="st">TAP</div><div class="ic"><svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></div></div>
    </div>
  </div>
</div>
</body></html>
