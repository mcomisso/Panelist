<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:480px;height:480px;overflow:hidden}
body{font-family:'Inter','SF Pro Display','Segoe UI',Roboto,'Ubuntu',sans-serif;-webkit-font-smoothing:antialiased}
.panel{width:480px;height:480px;display:flex;flex-direction:column;padding:14px 14px 12px;
  background:radial-gradient(130% 110% at 18% 0%, #151D28 0%, #0D1219 55%, #0A0E13 100%);color:#EAF0F6}
header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 13px}
h1{font-size:19px;font-weight:700;letter-spacing:.2px}
.hstat{font-size:14px;font-weight:500;color:#93A3B4}
.hstat b{color:#EAF0F6;font-weight:600}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:10px}
.tile{border-radius:22px;padding:13px 14px 12px;display:flex;flex-direction:column;justify-content:space-between;
  background:#151B24;border:1px solid #202935;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.chip{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#212B37}
.chip svg{width:19px;height:19px}
.name{font-size:16px;font-weight:600;line-height:1.15}
.state{font-size:12.5px;font-weight:500;color:#8C9BAB;margin-top:2px}
/* ON — soft tinted fills, one hue per device */
.on.c-amber{background:linear-gradient(165deg, rgba(246,201,92,.20), rgba(246,201,92,.07));border-color:rgba(246,201,92,.42)}
.on.c-amber .chip{background:rgba(246,201,92,.95)} .on.c-amber .chip svg{stroke:#231803}
.on.c-amber .state{color:#F2C95C}
.on.c-violet{background:linear-gradient(165deg, rgba(178,140,255,.20), rgba(178,140,255,.07));border-color:rgba(178,140,255,.42)}
.on.c-violet .chip{background:rgba(178,140,255,.95)} .on.c-violet .chip svg{stroke:#150A28}
.on.c-violet .state{color:#B28CFF}
.on.c-blue{background:linear-gradient(165deg, rgba(94,168,255,.20), rgba(94,168,255,.07));border-color:rgba(94,168,255,.42)}
.on.c-blue .chip{background:rgba(94,168,255,.95)} .on.c-blue .chip svg{stroke:#04101F}
.on.c-blue .state{color:#6FB2FF}
/* Partial — blinds */
.part.c-green{background:linear-gradient(165deg, rgba(97,214,140,.16), rgba(97,214,140,.05));border-color:rgba(97,214,140,.35)}
.part.c-green .chip{background:rgba(97,214,140,.92)} .part.c-green .chip svg{stroke:#031507}
.part.c-green .state{color:#61D68C}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.10);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:45%;border-radius:3px;background:#61D68C}
.off .chip svg{stroke:#93A3B4}
.act{background:linear-gradient(165deg,#1B232E,#141A22);border-color:#28323F}
.act .chip{background:#232E3B}
.meta{display:flex;flex-direction:column}
</style></head><body>
<div class="panel">
  <header><h1>Office</h1><div class="hstat"><b>22.1&#176;C</b> &#183; <b>50%</b> &#183; window closed</div></header>
  <div class="grid">
    <div class="tile on c-amber">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M12 13v6M8 21h8"/></svg></div>
      <div class="meta"><div class="name">Spots</div><div class="state">On &#183; 3 lights</div></div>
    </div>
    <div class="tile on c-violet">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v8l-7 4-7-4V7z"/><path d="M12 11v8M5 7l7 4 7-4"/></svg></div>
      <div class="meta"><div class="name">Nanoleaf</div><div class="state">On &#183; scene</div></div>
    </div>
    <div class="tile on c-blue">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="4" rx="2"/><path d="M6 16v2M18 16v2"/></svg></div>
      <div class="meta"><div class="name">Desk LED</div><div class="state">On &#183; 40%</div></div>
    </div>
    <div class="tile off">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4h5l.7 3.5c1.8 1 3 3 3 5.2A5.8 5.8 0 0 1 12.4 18h-.8a5.8 5.8 0 0 1-5.8-5.3c0-2.2 1.2-4.2 3-5.2z"/><path d="M10 21h4"/></svg></div>
      <div class="meta"><div class="name">Air con</div><div class="state">Off &#183; set 23.5&#176;C</div></div>
    </div>
    <div class="tile part c-green">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 12.5h16M4 16h16"/></svg></div>
      <div class="meta"><div class="name">Blinds</div><div class="state">Open &#183; 45%</div><div class="bar"><i></i></div></div>
    </div>
    <div class="tile act">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="#EAF0F6"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></div>
      <div class="meta"><div class="name">All off</div><div class="state">Scene</div></div>
    </div>
  </div>
</div>
</body></html>
