#  dim_brightness: 0.03

# ---- Info bar: rendered above every page -------------------------------
header:
  type: hstack
  spacing: 6
  padding: 8
  children:
    - type: label
      text: "Home"
      size: 18
      weight: 1
    - type: label
      format: "{state}°C"
      entity: sensor.living_room_temperature
      size: 18
    - type: label
      format: "{state}%"
      entity: sensor.living_room_humidity
      size: 18

pages:
  # ---- Quick: the few things touched most ------------------------------
  - name: "Quick"
    type: vstack
    padding: 8
    spacing: 8
    children:
      # 6 big tiles, 2 per row - the wall-panel layout
      - type: grid
        columns: 2
        spacing: 8
        weight: 1
        children:
          - type: toggle
            text: "Lights"
            entity: light.living_room
            action: toggle
          - type: toggle
            text: "Door"
            entity: binary_sensor.example_door
            action: none

          - type: toggle
            text: "Desk lamp"
            entity: switch.desk_lamp
            action: toggle
          - type: button
            text: "All off"
            entity: scene.all_off
            action: activate
            highlight: false

  # ---- One page per category -------------------------------------------
  - name: "Lights"
    type: vstack
    padding: 10
    spacing: 8
    children:
      - type: toggle
        text: "Living room"
        entity: light.living_room
        action: toggle
      - type: toggle
        text: "Desk lamp"
        entity: switch.desk_lamp
        action: toggle
      - type: hstack
        spacing: 6
        children:
          - type: button
            text: "Bright"
            entity: scene.living_bright
            action: activate
            weight: 1
          - type: button
            text: "Dim"
            entity: scene.living_dim
            action: activate
            weight: 1

  - name: "Climate"
    type: vstack
    padding: 10
    spacing: 8
    children:
      - type: toggle
        text: "Air conditioning"
        entity: climate.living_room_ac
        action: toggle
      - type: hstack
        spacing: 6
        children:
          - type: label
            format: "AC {state}"
            entity: climate.living_room_ac
            weight: 1
          - type: label
            format: "Hum {state}%"
            entity: sensor.living_room_humidity
            weight: 1
      # Example: live target temperature bar (climate's temperature attribute)
      #- type: progress
      #  text: "AC target"
      #  entity: climate.living_room_ac
      #  attribute: temperature
      #  min: 16
      #  max: 30
      #  format: "{value}\u00b0C"

