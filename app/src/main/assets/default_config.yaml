# --- PanelDash configuration (v0.2 - paginated) -------------------------
# Edit this file and save; the panel reloads it automatically within ~2 s.
#
# Config file locations (first readable one wins):
#   1. /sdcard/paneldash/config.yaml
#   2. /sdcard/Android/data/com.mcsoftware.paneldash/files/config.yaml
#
# Pages: "pages:" is a list; each entry is one screen with a bottom-nav label.
#   Page 1 should be "Quick" (most-used controls), then one page per category.
#   Without "pages:", a single "root:" element renders (legacy, no nav bar).
#
# Element types:
#   vstack / hstack   layout containers   props: spacing, padding, children
#   grid              tile grid           props: columns (1-4), spacing, weight
#   label             static text or live entity text ({state} / {friendly})
#   button            tap calls a Home Assistant service (raised look; accent when on)
#   toggle            switch; tap calls toggle
#   progress          value bar; reads entity state or an attribute (min/max/format)
#   camera            tile; tap opens a full-screen live view of a camera entity
#   check             health row; quiet while ok_above/ok_below/ok_is holds, red when tripped
#   spacer            gap; use "height" (px) or "weight" (flex)
# Common props: type, text, size, align, weight, entity, action, service, data, format,
#               attribute (progress), min/max (progress), sub/sub_entity (button),
#               color (per-component fill, "#RRGGBB"; defaults to the theme accent)
#
# Status tiles: off = near-black tile, on = full fill in the tile's own color.
#
# Wall-panel rules this file follows:
#   header:    info bar rendered above every page (see top of this file)
#   max 6 tiles per page in a 2-column grid -> big one-finger targets
# Actions: toggle | turn_on | turn_off | activate | none | service
#   action: service  ->  set "service: domain.service" and optional "data: {...}"
# Screen budget: 480 px total, keep each page under ~436 px of content.

server:
  url: "http://homeassistant.local:8123"
  token: "PASTE_LONG_LIVED_TOKEN_HERE"   # HA -> Profile -> Security -> Long-lived access tokens
  # token_file: "/sdcard/paneldash/token.txt"   # optional: read token from a file instead
  poll_seconds: 5

options:
  orientation: auto        # auto | portrait | landscape
  daynight: sensor         # sensor = panel's own light sensor (ambient lux);
                           # auto = sunrise->sunset (IP location, cached 30 days);
                           # off = always use `theme` below
  dark_below_lux: 10       # sensor mode: room counts as dark at/below this
  light_above_lux: 40      # sensor mode: room counts as lit at/above this
  #auto_brightness: true   # optional: scale screen brightness from the light sensor
  #brightness_min: 10
  #brightness_max: 255
  #idle_return_seconds: 900 # optional: back to the first page after N s with no touches
  #latitude: 51.5074       # daynight: auto - optional, skips the IP lookup
  #longitude: -0.1278

# Single theme (used when daynight is off, and until day/night themes parse)
theme:
  background: "#0E1116"
  surface: "#1B222C"
  accent: "#3D8BFD"
  text: "#EAF0F6"
  radius: 14
  font_scale: 1.0

# Optional day/night pair (both or neither; each falls back to `theme`)
theme_dark:
  background: "#000000"
  surface: "#161B21"
  accent: "#FF7A1A"
  text: "#EAF0F6"
  radius: 12
  font_scale: 1.0

theme_light:
  background: "#EEF1F5"
  surface: "#FFFFFF"
  accent: "#FF7A1A"
  text: "#141A21"
  radius: 12
  font_scale: 1.0

# ---- Optional: doorbell alert (live camera popup on ring) --------------
#doorbell:
